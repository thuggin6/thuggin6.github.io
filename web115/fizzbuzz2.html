<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teresa Huggins's Theoretical Hummingbird &#9733; WEB115 - Fizz Buzz 2</title>
    <!-- Cascading stylesheet -->
    <link href="styles/default.css" rel="stylesheet" />
	<link href="styles/brandformat.css" rel="stylesheet" />
    <link href="styles/fizzbuzz0.css" rel="stylesheet" />
    <script src="scripts/fizzbuzz2.js" crossorigin="anonymous"></script>
	<link href="images/sqcrownFavicon.png" rel="icon" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&family=Lavishly+Yours&family=Vast+Shadow&display=swap" rel="stylesheet">
	<script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    
</head>
<body>
    <div data-include="components/header.html"></div>
	<main class="brand">
		<h2 id="brand-heading2"><img src="images/logo.png" alt="Brand Logo"   width="300" />Fizz Buzz 2</h2>	
        <h3 id="greeting">Welcome to Sugar Queen Bakery</h3> 
        <!--this class id and div  is Oriented differently than any other page -->
		<div id="form_container">
        	
            <form id="fizzbuzz_form" onsubmit="generateGreeting(event)">
                <!--this class id and div  is Oriented differently than any other page -->
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" placeholder="First name here" required>
                </div>
                <!--this class id and div  is Oriented differently than any other page -->
                <div class="form-group">
                    <label for="middle_initial">Middle Initial(optional)</label>
                    <input type="text" id="middle_initial" maxlength="1" size="3">
                </div>
                <!--this class id and div  is Oriented differently than any other page -->
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" placeholder="Last name here" required>
                </div>

                <button type="submit">Submit</button>
            </form>       	
        </div>
        <!--this class id and div  is Oriented differently than any other page -->
        <div id="results_container">
            <h4 id="results_msg">greeting goes here</h4>
            <form id="results_form">
                <fieldset>
                    <legend>Check Number</legend>
                    <label for="count_value">Enter Counter</label>
                    <input type="number" id="count_value"  name="count_value" min="1"  required>
                    <label for="first_divisor">Enter first divisor:</label>
                    <input type="number" id="first_divisor"  name="first_divisor" min="1"  required>
                    <label for="second_divisor">Enter second divisor:</label>
                    <input type="number" id="second_divisor"  name="second_divisor" min="1" required>
                </fieldset>
                <button type="button" onclick="generateText(event)">View Results</button>
                <button type="button" onclick="handleResultsreset()">Reset</button>                   
                <button type="button" onclick="resetPage()">Back</button>            
            </form>  
        </div>  
	</main>

    <!-- Footer-->
	<div data-include="components/footer.html"></div>    
    <script src="scripts/include.js"></script>
	<script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
</body>
</html>
